services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - ./monitoring/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  gateway:
    build:
      context: .
      dockerfile: src/gateway/Dockerfile
    environment:
      SERVER_PORT: "5000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MOM_HOST: rabbitmq
      INPUT_BATCHER_QUEUE_PREFIX: ${INPUT_BATCHER_QUEUE_PREFIX:-input_batcher.input}
      INPUT_BATCHER_PARTITIONS: "${INPUT_BATCHER_PARTITIONS:-1}"
    ports:
      - "5000:5000"
    depends_on:
      rabbitmq:
        condition: service_healthy

  input-batcher-0:
    build:
      context: .
      dockerfile: src/input_batcher/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MOM_HOST: rabbitmq
      INPUT_BATCHER_QUEUE_PREFIX: ${INPUT_BATCHER_QUEUE_PREFIX:-input_batcher.input}
      INPUT_BATCHER_PARTITION_ID: "0"
      OUTPUT_QUEUE: preprocessor.input
      MAX_BATCH_BYTES: "${MAX_BATCH_BYTES:-1048576}"
    depends_on:
      rabbitmq:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: src/client/Dockerfile
    profiles: ["client"]
    environment:
      SERVER_HOST: gateway
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INPUT_FILE: /datasets/wikipedia_sample.parquet
      OUTPUT_DIR: /output
    volumes:
      - ./datasets:/datasets:ro
      - ./output/distributed:/output

  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - ${DOCKER_DATA_ROOT:-/var/lib/docker}:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      rabbitmq:
        condition: service_healthy
      cadvisor:
        condition: service_started

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/system-overview.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
