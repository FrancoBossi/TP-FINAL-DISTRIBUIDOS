services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - ./monitoring/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  gateway:
    stop_grace_period: ${STOP_GRACE_PERIOD:-2m}
    build:
      context: .
      dockerfile: src/gateway/Dockerfile
    environment:
      SERVER_PORT: "5000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MOM_HOST: rabbitmq
      INPUT_BATCHER_QUEUE_PREFIX: ${INPUT_BATCHER_QUEUE_PREFIX:-input_batcher.input}
      INPUT_BATCHER_PARTITIONS: "${INPUT_BATCHER_PARTITIONS:-3}"
    ports:
      - "${GATEWAY_HOST_PORT:-5001}:5000"
    depends_on:
      rabbitmq:
        condition: service_healthy

  input-batcher-0:
    stop_grace_period: ${STOP_GRACE_PERIOD:-2m}
    build:
      context: .
      dockerfile: src/input_batcher/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MOM_HOST: rabbitmq
      INPUT_BATCHER_QUEUE_PREFIX: ${INPUT_BATCHER_QUEUE_PREFIX:-input_batcher.input}
      INPUT_BATCHER_PARTITION_ID: "0"
      OUTPUT_QUEUE: preprocessor.input
      MAX_BATCH_BYTES: "${MAX_BATCH_BYTES:-10485760}"
    depends_on:
      rabbitmq:
        condition: service_healthy

  input-batcher-1:
    stop_grace_period: ${STOP_GRACE_PERIOD:-2m}
    build:
      context: .
      dockerfile: src/input_batcher/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MOM_HOST: rabbitmq
      INPUT_BATCHER_QUEUE_PREFIX: ${INPUT_BATCHER_QUEUE_PREFIX:-input_batcher.input}
      INPUT_BATCHER_PARTITION_ID: "1"
      OUTPUT_QUEUE: preprocessor.input
      MAX_BATCH_BYTES: "${MAX_BATCH_BYTES:-10485760}"
    depends_on:
      rabbitmq:
        condition: service_healthy

  input-batcher-2:
