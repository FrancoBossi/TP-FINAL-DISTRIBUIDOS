      - /var/run/docker.sock:/var/run/docker.sock
      - fm_state_2:/state
    depends_on:
      rabbitmq:
        condition: service_healthy

  client:
    stop_grace_period: ${STOP_GRACE_PERIOD:-2m}
    build:
      context: .
      dockerfile: src/client/Dockerfile
    profiles: ["client"]
    environment:
      SERVER_HOST: gateway
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INPUT_FILE: /datasets/wikipedia_sample.parquet
      OUTPUT_DIR: /output
    volumes:
      - ./datasets:/datasets:ro
      - ${DISTRIBUTED_OUTPUT_DIR:-./output/distributed}:/output

  cadvisor:
    profiles: ["monitoring"]
    image: ghcr.io/google/cadvisor:0.55.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --containerd=/rootfs/run/containerd/containerd.sock
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - ${DOCKER_DATA_ROOT:-/var/lib/docker}:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      rabbitmq:
        condition: service_healthy
      cadvisor:
        condition: service_started

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/system-overview.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

